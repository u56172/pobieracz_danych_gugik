name: Create release

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    name: Release pushed tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          repo: ${{ github.repository }}
        run: |
          version=$(grep '^version=' metadata.txt | cut -d '=' -f2 | xargs)
          tag="v$version"

          gh api "repos/$repo/releases/generate-notes" \
            -f tag_name="$tag" \
            --jq .body > notes.md

          sed -i "s/What's Changed/Wprowadzone zmiany/" notes.md
          sed -i "s/Full Changelog/Pełny Changelog/" notes.md
         
          gh release create "$tag" \
            --repo "$repo" \
            --title "$tag" \
            --notes-file notes.md
